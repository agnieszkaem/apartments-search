name: Schedule Test

on:
  schedule:
    # Every 5 minutes
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Print timestamp
        run: |
          echo "Scheduled workflow is running!"
          echo "UTC time: $(date -u)"
          echo "Runner: $RUNNER_OS"

      - name: Done
        run: echo "Success!"
